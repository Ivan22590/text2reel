[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "text2reel"
version = "0.1.0"
description = "AI text-to-video platform backend"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<3",
  "celery[redis]>=5.4,<6",
  "openai>=1.54,<2",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "python-multipart>=0.0.17",
  "psycopg[binary]>=3.2,<4",
  "pillow>=11.0,<12",
  "edge-tts>=7.0,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff==0.17.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers in argument defaults are the intended usage.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Cookie", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs ffmpeg/ffprobe installed (skipped otherwise)"]
