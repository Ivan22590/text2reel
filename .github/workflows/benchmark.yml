name: Render benchmark

# Manual run: Actions -> "Render benchmark" -> Run workflow. Measures render time of a ~1 minute
# 1080p video for several FFmpeg settings and for 3 parallel renders (docs/METRICS.md).
on:
  workflow_dispatch:
    inputs:
      scenes:
        description: Scenes
        default: "10"
      seconds:
        description: Narration seconds per scene
        default: "6"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: nproc && free -m && lscpu | grep -E "Model name|MHz" || true
      - run: python -m tests.benchmark_render --scenes "${{ inputs.scenes }}" --seconds "${{ inputs.seconds }}" --out benchmark.md
      - run: cat benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: backend/benchmark.md
