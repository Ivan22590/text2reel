# Dev stack: docker compose up --build   (UI http://localhost:5173, API http://localhost:8000)
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: sqlite:////data/app.db
    STORAGE_DIR: /data
  volumes:
    - ./backend:/app
    - storage:/data
  depends_on:
    - redis

services:
  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker-ai:
    <<: *backend
    command: celery -A app.workers.celery_app worker -Q ai -c 4 -n ai@%h -l info

  worker-render:
    <<: *backend
    command: celery -A app.workers.celery_app worker -Q render -c ${RENDER_CONCURRENCY:-2} -n render@%h -l info

  # Daily housekeeping (expired projects, old cache, stuck jobs): the `cleanup` task
  beat:
    <<: *backend
    command: celery -A app.workers.celery_app beat -s /data/celerybeat-schedule -l info

  redis:
    image: redis:7.4-alpine

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  storage:
